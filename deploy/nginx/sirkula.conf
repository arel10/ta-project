# ==============================================================================
# Nginx Reverse Proxy Configuration for Sirkula (sirkula.tech)
# ==============================================================================

server {
    listen 80;
    server_name sirkula.tech www.sirkula.tech;

    client_max_body_size 50M;

    # Next.js Application (Landing Page, Auth, & Dashboard)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Alias /admin ke /dashboard agar kompatibel jika ada yang mengakses /admin
    location = /admin {
        return 301 /dashboard;
    }
    location /admin/ {
        return 301 /dashboard;
    }

    # Backend Flask REST API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for long-running operations (Excel bulk import, export, ML inference)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Static File Uploads (KTP photos, Reward images)
    location /api/uploads/ {
        alias /opt/sirkula/backend/uploads/;
        expires 30d;
        access_log off;
    }
}
